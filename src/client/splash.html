<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CLACK</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="./splash.css" />
  </head>
  <body>
    <main class="splash-shell">
      <section class="splash-card" aria-labelledby="splash-title">
        <div class="splash-meta">
          <span class="day-pill" id="splash-day">DAY 1</span>
          <span class="biome-badge" id="splash-biome">
            <span class="biome-dot" id="splash-dot" aria-hidden="true"></span>
            <span id="splash-biome-label">Cedar Biome</span>
          </span>
        </div>

        <div class="splash-thumb-frame">
          <img
            class="splash-thumb"
            id="splash-thumb"
            src="./thumbs/cedar.png"
            alt="Clack Cedar Courtyard floating island preview"
            width="360"
            height="216"
            decoding="async"
          />
        </div>

        <h1 class="splash-title" id="splash-title">Cedar Courtyard</h1>
        <p class="splash-par" id="splash-par">Par 2</p>
        <p class="splash-community" id="splash-community"></p>
        <p class="splash-subtitle" id="splash-subtitle"></p>

        <button class="play-btn" id="splash-play-btn" type="button">
          <span class="play-icon" id="splash-play-icon" aria-hidden="true"></span>
          <span id="splash-play-label">Play Today</span>
        </button>
      </section>
    </main>

    <script type="module" src="./splash.ts"></script>
  </body>
</html>
